<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deskli</title>
    <script>
      try {
        const theme = localStorage.getItem('deskli.theme')
        document.documentElement.classList.toggle(
          'dark',
          theme === 'dark' ||
            ((!theme || theme === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches),
        )
      } catch {
        document.documentElement.classList.toggle(
          'dark',
          matchMedia('(prefers-color-scheme: dark)').matches,
        )
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
